<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account &mdash; RAVYNN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#fff;color:#111;font-size:14px}
.announcement-bar{background:#000;color:#fff;text-align:center;font-size:12px;font-weight:500;letter-spacing:.5px;padding:10px 40px}
.site-header{border-bottom:1px solid #e8e8e8;height:60px;display:flex;align-items:center;justify-content:center;position:relative;padding:0 20px}
.header-left{position:absolute;left:20px;display:flex;align-items:center}
.header-right{position:absolute;right:20px;display:flex;gap:4px}
.header-menu-btn,.header-icon-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;align-items:center;text-decoration:none;color:#000}
.header-menu-btn svg,.header-icon-btn svg{width:22px;height:22px}

/* Login */
.login-wrap{max-width:440px;margin:60px auto;padding:0 20px 80px}
.login-card{border:1.5px solid #e8e8e8;border-radius:12px;padding:32px 28px}
.login-icon{width:52px;height:52px;background:#f5f5f5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.login-title{font-size:20px;font-weight:800;letter-spacing:.5px;margin-bottom:6px}
.login-sub{font-size:13px;color:#888;margin-bottom:28px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#555;margin-bottom:7px}
.field input{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:13px 14px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.field input:focus{border-color:#000}
.btn-primary{width:100%;background:#000;color:#fff;border:none;padding:14px;font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;border-radius:8px;transition:background .2s;font-family:inherit}
.btn-primary:hover{background:#222}
.btn-primary:disabled{background:#aaa;cursor:not-allowed}
.form-error{color:#e53e3e;font-size:13px;margin-top:12px;text-align:center;display:none}

/* Dashboard */
.dashboard{display:none;max-width:680px;margin:0 auto;padding:0 20px 100px}
.dash-header{padding:24px 0 0;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #e8e8e8;padding-bottom:20px;margin-bottom:0}
.dash-greet{font-size:16px;font-weight:800;margin-bottom:3px}
.dash-sub{font-size:13px;color:#888}
.btn-logout{background:none;border:1.5px solid #e0e0e0;border-radius:7px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;color:#555;transition:all .2s;font-family:inherit;white-space:nowrap}
.btn-logout:hover{border-color:#000;color:#000}

/* Tabs */
.tabs{display:flex;border-bottom:1.5px solid #e8e8e8;margin:24px 0 0}
.tab{flex:1;background:none;border:none;border-bottom:2.5px solid transparent;padding:12px 4px;font-size:13px;font-weight:600;cursor:pointer;color:#888;transition:all .15s;letter-spacing:.2px;font-family:inherit;margin-bottom:-1.5px}
.tab.active{color:#000;border-bottom-color:#000}
.tab-panel{display:none;padding-top:24px}
.tab-panel.active{display:block}

/* Order cards */
.order-card{border:1.5px solid #e8e8e8;border-radius:10px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.order-card:hover{border-color:#bbb}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oc-id{font-size:13px;font-weight:700;letter-spacing:.3px;margin-bottom:2px}
.oc-date{font-size:12px;color:#999}
.oc-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.status-badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.s-pending{background:#fff3cd;color:#856404}
.s-confirmed{background:#d1e7dd;color:#0a3622}
.s-shipped{background:#cfe2ff;color:#084298}
.s-delivered{background:#d1e7dd;color:#0a3622}
.s-cancelled{background:#f8d7da;color:#842029}
.oc-arrow{color:#ccc;font-size:16px;line-height:1;transition:transform .2s}
.order-card.expanded .oc-arrow{transform:rotate(90deg)}
.oc-summary{margin-top:10px;font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-total{margin-top:6px;font-size:13px;font-weight:700}

/* Order detail */
.order-detail{display:none;border:1.5px solid #111;border-radius:10px;padding:18px 16px;margin-bottom:10px;margin-top:-2px;border-top-left-radius:0;border-top-right-radius:0;border-top:none}
.order-detail.open{display:block}
.expanded{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:#111;border-color:#111}
.od-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#aaa;margin-bottom:10px}

/* Timeline */
.timeline{display:flex;margin-bottom:4px}
.tl-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.tl-step:not(:last-child)::after{content:'';position:absolute;top:11px;left:calc(50% + 12px);right:calc(-50% + 12px);height:2px;background:#e0e0e0;z-index:0}
.tl-step.done:not(:last-child)::after{background:#000}
.tl-dot{width:24px;height:24px;border-radius:50%;background:#e0e0e0;border:2px solid #e0e0e0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;margin-bottom:6px;flex-shrink:0}
.tl-step.done .tl-dot{background:#000;border-color:#000}
.tl-step.current .tl-dot{background:#fff;border:2.5px solid #000;box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.tl-lbl{font-size:9px;font-weight:600;color:#bbb;text-align:center;line-height:1.3}
.tl-step.done .tl-lbl{color:#555}
.tl-step.current .tl-lbl{color:#000;font-weight:700}

/* Items table */
.od-items{margin-bottom:14px}
.od-item{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid #f3f3f3}
.od-item:last-child{border-bottom:none}
.od-item-n{flex:1;color:#333;margin-right:10px}
.od-item-p{font-weight:600}
.od-totals{background:#f8f8f8;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.od-tot-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.od-tot-row.grand{font-weight:700;font-size:14px;border-top:1px solid #e0e0e0;margin-top:6px;padding-top:8px}
.od-disc{color:#2e7d32}
.od-addr{font-size:13px;color:#555;line-height:1.7;margin-bottom:14px;padding:12px 14px;border:1px solid #f0f0f0;border-radius:8px}
.od-track{background:#eff6ff;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.od-cancelled{background:#fff0f0;border:1px solid #f8d7da;border-radius:8px;padding:12px 16px;font-size:13px;font-weight:600;color:#842029;text-align:center;margin-bottom:14px}

/* Action buttons */
.od-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn-action{border:1.5px solid #e0e0e0;background:#fff;padding:10px 18px;font-size:12px;font-weight:700;cursor:pointer;border-radius:8px;transition:all .2s;font-family:inherit;letter-spacing:.2px}
.btn-action:hover{border-color:#000;color:#000}
.btn-cancel{border-color:#fcc;color:#c0392b}
.btn-cancel:hover{border-color:#c0392b;background:#fff5f5}

/* Wallet */
.wallet-card{background:#000;color:#fff;border-radius:12px;padding:24px 20px;margin-bottom:20px}
.wc-label{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;margin-bottom:8px}
.wc-amount{font-size:38px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}
.wc-sub{font-size:12px;opacity:.5}
.section-title{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#888;margin-bottom:12px}
.txn-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f0f0f0}
.txn-item:last-child{border-bottom:none}
.txn-desc{font-size:13px;color:#333}
.txn-date{font-size:11px;color:#bbb;margin-top:2px}
.txn-amt{font-size:14px;font-weight:700}
.txn-credit{color:#2e7d32}
.txn-debit{color:#c62828}

/* Profile */
.pf-card{border:1.5px solid #e8e8e8;border-radius:10px;padding:16px;margin-bottom:10px}
.pf-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#bbb;margin-bottom:5px}
.pf-val{font-size:14px;font-weight:500;line-height:1.6}
.pf-stats{background:#f8f8f8;border-radius:10px;padding:14px 16px;font-size:13px;color:#777;margin-bottom:16px}
.pf-stat{display:inline-block;margin-right:20px;margin-bottom:4px}
.pf-stat strong{color:#111;font-size:15px;font-weight:700}
.btn-wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:11px 20px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;transition:opacity .2s}
.btn-wa:hover{opacity:.9}

/* Empty / loading states */
.empty-state{text-align:center;padding:50px 20px}
.empty-state svg{stroke:#ddd;margin-bottom:16px}
.empty-state p{font-size:14px;color:#aaa;margin-bottom:16px}
.empty-state a{color:#000;text-decoration:none;font-weight:700}
.loading{text-align:center;padding:50px 20px;color:#aaa;font-size:13px}
.spinner{width:28px;height:28px;border:3px solid #eee;border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:26px 22px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:800;margin-bottom:4px}
.modal-sub{font-size:13px;color:#888;margin-bottom:20px}
.mfield{margin-bottom:14px}
.mfield label{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#555;margin-bottom:6px}
.mfield select,.mfield textarea{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;resize:none;background:#fff}
.mfield select:focus,.mfield textarea:focus{border-color:#000}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.modal-actions .btn-action{flex:1;text-align:center;padding:11px}
.modal-actions .btn-primary{flex:1;width:auto;padding:11px}
.modal-success{text-align:center;padding:8px 0}
.success-icon{width:56px;height:56px;background:#f0fff4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:2px solid #c3e6cb}
.modal-success h3{font-size:16px;font-weight:700;margin-bottom:6px}
.modal-success p{font-size:13px;color:#777;margin-bottom:20px;line-height:1.6}

/* Bottom nav */
@media(max-width:767px){
  .mobile-bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e8e8;z-index:100;height:60px}
  .mobile-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#888;font-size:9px;font-weight:600;letter-spacing:.5px;gap:4px}
  .mobile-nav-item svg{width:20px;height:20px}
  .mobile-nav-item.active{color:#000}
  .mobile-nav-center{background:#000;color:#fff;border-radius:50%;width:44px;height:44px;margin-top:-22px;flex:none;font-size:8px;font-weight:800;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;justify-content:center}
}
@media(min-width:768px){.mobile-bottom-nav{display:none}}

.wa-float{position:fixed;bottom:80px;right:20px;z-index:500}
.wa-float a{display:flex;align-items:center;justify-content:center;width:50px;height:50px;background:#25D366;border-radius:50%;box-shadow:0 4px 14px rgba(37,211,102,.4);text-decoration:none;transition:transform .2s}
.wa-float a:hover{transform:scale(1.1)}
@media(min-width:768px){.wa-float{bottom:30px}}
</style>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCLJ4PwOPprXEQ5wfzVWmdzcCe-2dAfM8U",
  authDomain: "ravynn-orders.firebaseapp.com",
  projectId: "ravynn-orders",
  storageBucket: "ravynn-orders.firebasestorage.app",
  messagingSenderId: "1043146014819",
  appId: "1:1043146014819:web:b75c63746e60afaadaf856"
});
var db = firebase.firestore();

var STATE = { phone: '', name: '', orders: [] };

function rs(n) { return '\u20B9' + Number(n || 0).toLocaleString('en-IN'); }
function fdate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); } catch(e) { return ''; }
}
function sclass(s) {
  return { pending:'s-pending', confirmed:'s-confirmed', shipped:'s-shipped', delivered:'s-delivered', cancelled:'s-cancelled' }[s] || 's-pending';
}
function slabel(s) {
  return { pending:'Order Placed', confirmed:'Confirmed', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled' }[s] || 'Pending';
}
function daysSince(iso) {
  if (!iso) return 999;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

// ---- LOGIN ----
var loginBtn = document.getElementById('login-btn');
var loginPhone = document.getElementById('login-phone');
var loginError = document.getElementById('login-error');

loginBtn.addEventListener('click', doLogin);
loginPhone.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

function doLogin() {
  var ph = loginPhone.value.trim().replace(/\D/g, '');
  loginError.style.display = 'none';
  if (!ph || ph.length !== 10) {
    loginError.textContent = 'Please enter a valid 10-digit phone number.';
    loginError.style.display = 'block';
    return;
  }
  loginBtn.disabled = true;
  loginBtn.textContent = 'Loading...';

  db.collection('orders').where('customer.phone', '==', ph).get()
    .then(function(snap) {
      var orders = [];
      snap.forEach(function(doc) { var d = doc.data(); d._docId = doc.id; orders.push(d); });
      orders.sort(function(a, b) { return new Date(b.createdAt || 0) - new Date(a.createdAt || 0); });
      STATE.orders = orders;
      STATE.phone = ph;
      STATE.name = (orders.length && orders[0].customer) ? (orders[0].customer.name || '') : '';
      try { sessionStorage.setItem('rvn_ph', ph); } catch(e) {}
      mountDashboard();
    })
    .catch(function() {
      loginError.textContent = 'Connection error. Please try again.';
      loginError.style.display = 'block';
    })
    .finally(function() {
      loginBtn.disabled = false;
      loginBtn.textContent = 'View My Orders';
    });
}

function mountDashboard() {
  document.getElementById('login-wrap').style.display = 'none';
  var dash = document.getElementById('dashboard');
  dash.style.display = 'block';
  var first = STATE.name ? STATE.name.split(' ')[0] : null;
  document.getElementById('dash-greet').textContent = first ? ('Hello, ' + first + '!') : 'Hello!';
  document.getElementById('dash-sub').textContent = '+91 ' + STATE.phone;
  renderOrders();
  renderWallet();
  renderProfile();
}

document.getElementById('btn-logout').addEventListener('click', function() {
  try { sessionStorage.removeItem('rvn_ph'); } catch(e) {}
  STATE = { phone: '', name: '', orders: [] };
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-wrap').style.display = 'block';
  loginPhone.value = '';
  // reset tabs
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelector('[data-tab="orders"]').classList.add('active');
  document.getElementById('tab-orders').classList.add('active');
});

// ---- TABS ----
document.querySelectorAll('.tab').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

// ---- ORDERS ----
function renderOrders() {
  var el = document.getElementById('orders-content');
  if (!STATE.orders.length) {
    el.innerHTML = '<div class="empty-state"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><p>No orders found for this number.</p><a href="collection.html">Start Shopping &rarr;</a></div>';
    return;
  }
  var html = '';
  STATE.orders.forEach(function(o, i) {
    var items = Array.isArray(o.items) ? o.items : [];
    var summary = items.slice(0, 2).map(function(it) {
      return (it.title || it.name || 'Item') + (it.size ? ' (' + it.size + ')' : '');
    }).join(', ') + (items.length > 2 ? ' +' + (items.length - 2) + ' more' : '');
    html += '<div class="order-card" id="oc-' + i + '" onclick="toggleDetail(' + i + ')">';
    html += '<div class="oc-top"><div>';
    html += '<div class="oc-id">' + (o.orderId || o._docId) + '</div>';
    html += '<div class="oc-date">' + fdate(o.createdAt) + '</div>';
    html += '</div><div class="oc-right">';
    html += '<span class="status-badge ' + sclass(o.status) + '">' + slabel(o.status) + '</span>';
    html += '<span class="oc-arrow">&#8250;</span>';
    html += '</div></div>';
    if (summary) html += '<div class="oc-summary">' + summary + '</div>';
    html += '<div class="oc-total">' + rs(o.total) + '</div>';
    html += '</div>';
    html += '<div class="order-detail" id="od-' + i + '">' + buildDetail(o, i) + '</div>';
  });
  el.innerHTML = html;
}

function toggleDetail(i) {
  var card = document.getElementById('oc-' + i);
  var detail = document.getElementById('od-' + i);
  var open = detail.classList.contains('open');
  document.querySelectorAll('.order-card').forEach(function(c) { c.classList.remove('expanded'); });
  document.querySelectorAll('.order-detail').forEach(function(d) { d.classList.remove('open'); });
  if (!open) { card.classList.add('expanded'); detail.classList.add('open'); }
}

function buildDetail(o, idx) {
  var status = o.status || 'pending';
  var items = Array.isArray(o.items) ? o.items : [];
  var c = o.customer || {};
  var canCancel = (status === 'pending' || status === 'confirmed');
  var canReturn = (status === 'delivered') && daysSince(o.createdAt) <= 7;
  var isCancelled = status === 'cancelled';
  var html = '';

  if (isCancelled) {
    html += '<div class="od-cancelled">This order has been cancelled.</div>';
  } else {
    var steps = ['Order Placed', 'Confirmed', 'Shipped', 'Delivered'];
    var keys = ['pending', 'confirmed', 'shipped', 'delivered'];
    var cur = keys.indexOf(status);
    html += '<div class="od-label" style="margin-bottom:14px">Order Status</div>';
    html += '<div class="timeline" style="margin-bottom:20px">';
    steps.forEach(function(step, si) {
      var cls = si < cur ? 'done' : (si === cur ? 'current' : '');
      html += '<div class="tl-step ' + cls + '"><div class="tl-dot">';
      if (si < cur) html += '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>';
      else if (si === cur) html += '<div style="width:8px;height:8px;background:#000;border-radius:50%"></div>';
      html += '</div><div class="tl-lbl">' + step + '</div></div>';
    });
    html += '</div>';
  }

  if (o.trackingId || o.tracking_id) {
    html += '<div class="od-track" style="margin-bottom:14px">Tracking ID: <strong>' + (o.trackingId || o.tracking_id) + '</strong>' + (o.courier ? ' &mdash; ' + o.courier : '') + '</div>';
  }

  if (items.length) {
    html += '<div class="od-label">Items</div><div class="od-items">';
    items.forEach(function(it) {
      var n = (it.title || it.name || 'Item') + (it.size ? ' &mdash; ' + it.size : '') + ' &times;' + (it.qty || 1);
      html += '<div class="od-item"><span class="od-item-n">' + n + '</span><span class="od-item-p">' + rs((it.price || 0) * (it.qty || 1)) + '</span></div>';
    });
    html += '</div>';
  }

  html += '<div class="od-totals">';
  html += '<div class="od-tot-row"><span>Subtotal</span><span>' + rs(o.subtotal) + '</span></div>';
  if (o.discount > 0) html += '<div class="od-tot-row od-disc"><span>Discount' + (o.coupon ? ' (' + o.coupon + ')' : '') + '</span><span>-' + rs(o.discount) + '</span></div>';
  html += '<div class="od-tot-row"><span>Shipping</span><span>' + (o.shipping === 0 || o.shipping === '0' ? 'FREE' : rs(o.shipping)) + '</span></div>';
  html += '<div class="od-tot-row grand"><span>Total</span><span>' + rs(o.total) + '</span></div>';
  html += '</div>';

  if (c.name || c.address) {
    html += '<div class="od-label">Delivery Address</div>';
    html += '<div class="od-addr">' + [c.name, c.address, c.city, c.state, c.pincode].filter(Boolean).join(', ') + '</div>';
  }

  if (canCancel || canReturn) {
    html += '<div class="od-actions">';
    if (canCancel) html += '<button class="btn-action btn-cancel" onclick="openCancel(\'' + o._docId + '\',\'' + (o.orderId || '') + '\');event.stopPropagation()">Cancel Order</button>';
    if (canReturn) html += '<button class="btn-action" onclick="openReturn(\'' + o._docId + '\',\'' + (o.orderId || '') + '\');event.stopPropagation()">Return / Replace</button>';
    html += '</div>';
  } else if (status === 'delivered' && !canReturn) {
    html += '<div style="font-size:12px;color:#aaa;margin-top:4px">Return window (7 days) has passed.</div>';
  }

  return html;
}

// ---- WALLET ----
function renderWallet() {
  var el = document.getElementById('wallet-content');
  db.collection('wallets').doc(STATE.phone).get()
    .then(function(snap) {
      var bal = 0, txns = [];
      if (snap.exists) { var w = snap.data(); bal = w.balance || 0; txns = Array.isArray(w.transactions) ? w.transactions : []; }
      var html = '<div class="wallet-card"><div class="wc-label">Store Wallet Balance</div>';
      html += '<div class="wc-amount">' + rs(bal) + '</div>';
      html += '<div class="wc-sub">Redeemable at checkout</div></div>';
      if (txns.length) {
        html += '<div class="section-title">Transaction History</div><div>';
        txns.slice().sort(function(a,b){return new Date(b.date||0)-new Date(a.date||0);}).forEach(function(t) {
          var cr = t.type === 'credit' || t.amount > 0;
          html += '<div class="txn-item"><div><div class="txn-desc">' + (t.description || (cr ? 'Wallet Credit' : 'Wallet Used')) + '</div><div class="txn-date">' + fdate(t.date) + '</div></div>';
          html += '<div class="txn-amt ' + (cr ? 'txn-credit' : 'txn-debit') + '">' + (cr ? '+' : '-') + rs(Math.abs(t.amount)) + '</div></div>';
        });
        html += '</div>';
      } else {
        html += '<div style="text-align:center;padding:30px;color:#bbb;font-size:13px">No transactions yet.</div>';
      }
      el.innerHTML = html;
    })
    .catch(function() {
      el.innerHTML = '<div class="wallet-card"><div class="wc-label">Store Wallet Balance</div><div class="wc-amount">' + rs(0) + '</div><div class="wc-sub">Redeemable at checkout</div></div><div style="text-align:center;padding:30px;color:#bbb;font-size:13px">No transactions yet.</div>';
    });
}

// ---- PROFILE ----
function renderProfile() {
  var el = document.getElementById('profile-content');
  var orders = STATE.orders;
  var c = (orders.length && orders[0].customer) ? orders[0].customer : {};
  var totalSpent = orders.reduce(function(s, o) { return s + (o.total || 0); }, 0);

    html += '<div class="pf-card"><div class="pf-label">Last Used Address</div>';

  el.innerHTML = html;
}

// ---- CANCEL MODAL ----
function openCancel(docId, orderId) {
  var label = orderId || docId;
  document.getElementById('modal-inner').innerHTML =
    '<div class="modal-title">Cancel Order</div>' +
    '<div class="modal-sub">Order #' + label + '</div>' +
    '<div class="mfield"><label>Reason</label><select id="m-reason"><option value="">Select a reason</option><option>Changed my mind</option><option>Ordered by mistake</option><option>Found a better price elsewhere</option><option>Shipping time too long</option><option>Other</option></select></div>' +
    '<div class="mfield"><label>Comments (optional)</label><textarea id="m-comment" rows="3" placeholder="Any additional details..."></textarea></div>' +
    '<div class="modal-actions"><button class="btn-action" onclick="closeModal()">Go Back</button><button class="btn-primary" style="background:#c0392b" id="m-submit" onclick="submitRequest(\'cancel\',\'' + docId + '\',\'' + label + '\')">Cancel Order</button></div>';
  document.getElementById('req-modal').classList.add('open');
}

// ---- RETURN MODAL ----
function openReturn(docId, orderId) {
  var label = orderId || docId;
  document.getElementById('modal-inner').innerHTML =
    '<div class="modal-title">Return / Replace</div>' +
    '<div class="modal-sub">Order #' + label + '</div>' +
    '<div class="mfield"><label>Request Type</label><select id="m-type"><option value="">Select type</option><option value="return">Return (Refund)</option><option value="replace">Replace (Exchange)</option></select></div>' +
    '<div class="mfield"><label>Reason</label><select id="m-reason"><option value="">Select a reason</option><option>Wrong item delivered</option><option>Wrong size delivered</option><option>Damaged / defective item</option><option>Item not as described</option><option>Quality issue</option><option>Other</option></select></div>' +
    '<div class="mfield"><label>Details (optional)</label><textarea id="m-comment" rows="3" placeholder="Describe the issue..."></textarea></div>' +
    '<div class="modal-actions"><button class="btn-action" onclick="closeModal()">Go Back</button><button class="btn-primary" id="m-submit" onclick="submitRequest(\'return\',\'' + docId + '\',\'' + label + '\')">Submit Request</button></div>';
  document.getElementById('req-modal').classList.add('open');
}

function submitRequest(type, docId, label) {
  var reason = document.getElementById('m-reason') ? document.getElementById('m-reason').value : '';
  var comment = document.getElementById('m-comment') ? document.getElementById('m-comment').value.trim() : '';
  var reqType = type;
  if (type === 'return') {
    var t = document.getElementById('m-type') ? document.getElementById('m-type').value : '';
    if (!t) { alert('Please select request type.'); return; }
    reqType = t;
  }
  if (!reason) { alert('Please select a reason.'); return; }

  var btn = document.getElementById('m-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }

  db.collection('requests').add({
    type: reqType,
    orderId: label,
    docId: docId,
    phone: STATE.phone,
    name: STATE.name,
    reason: reason,
    comment: comment,
    createdAt: new Date().toISOString(),
    status: 'pending'
  }).then(function() {
    var typeLabel = reqType === 'cancel' ? 'cancellation' : (reqType === 'replace' ? 'replacement' : 'return');
    document.getElementById('modal-inner').innerHTML =
      '<div class="modal-success">' +
      '<div class="success-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<h3>Request Submitted!</h3>' +
      '<p>We\'ll review your ' + typeLabel + ' request and reach out within 24 hours.</p>' +
      '<button class="btn-primary" onclick="closeModal()">Done</button>' +
      '</div>';
  }).catch(function() {
    if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
    alert('Could not submit. Please contact us on WhatsApp.');
  });
}

function closeModal() {
  document.getElementById('req-modal').classList.remove('open');
}
document.getElementById('req-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

try {
  var saved = sessionStorage.getItem('rvn_ph');
  if (saved && saved.length === 10) { loginPhone.value = saved; doLogin(); }
} catch(e) {}
