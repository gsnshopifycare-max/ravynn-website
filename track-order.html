*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#fff;color:#111}

.track-btn:hover{background:#222}
.result{margin-top:24px;display:none}
.result.show{display:block}
.order-card{border:1.5px solid #e8e8e8;border-radius:10px;padding:18px 16px;margin-bottom:12px}
.order-id{font-size:13px;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.order-meta{font-size:12px;color:#888;margin-bottom:12px}
.order-status{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.status-pending{background:#fff3cd;color:#856404}
.status-confirmed{background:#d1e7dd;color:#0a3622}
.status-shipped{background:#cfe2ff;color:#084298}
.status-delivered{background:#d1e7dd;color:#0a3622}
.order-items{margin-top:12px;border-top:1px solid #f0f0f0;padding-top:12px}
.order-item{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#444}
.order-total{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0}
.no-order{text-align:center;padding:40px 20px;color:#888}

.error-msg{color:#e53e3e;font-size:13px;margin-top:12px;text-align:center}
.wa-help{text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid #f0f0f0}

<!-- Firebase -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDEjCb9nYzHxlm7fmHmLi9BsHb2P1wVYGk",
  authDomain: "ravynn-orders.firebaseapp.com",
  databaseURL: "https://ravynn-orders-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ravynn-orders",
  storageBucket: "ravynn-orders.appspot.com",
  messagingSenderId: "987654321",
  appId: "1:987654321:web:abc123"
};

let app, db;
try {
  app = initializeApp(firebaseConfig);
  db = getDatabase(app);
} catch(e) {}

const STATUS_MAP = {
  pending:   { label: 'Order Placed',  cls: 'status-pending',   icon: 'üì¶' },
  confirmed: { label: 'Confirmed',     cls: 'status-confirmed', icon: '‚úÖ' },
  shipped:   { label: 'Shipped',       cls: 'status-shipped',   icon: 'üöö' },
  delivered: { label: 'Delivered',     cls: 'status-delivered', icon: 'üéâ' },
};

function fmt(n) { return '‚Çπ' + Number(n).toLocaleString('en-IN'); }

async function trackOrder() {
  const orderId = document.getElementById('track-order-id').value.trim().toUpperCase();
  const phone   = document.getElementById('track-phone').value.trim().replace(/\D/g,'');
  const errEl   = document.getElementById('track-error');
  const resultEl = document.getElementById('track-result');
  const contentEl = document.getElementById('track-result-content');

  errEl.style.display = 'none';
  if (!orderId) { errEl.textContent = 'Please enter your Order ID.'; errEl.style.display = 'block'; return; }
  if (!phone || phone.length !== 10) { errEl.textContent = 'Please enter a valid 10-digit phone number.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('track-btn');
  btn.textContent = 'Searching...';
  btn.disabled = true;

  try {
    let order = null;
    // Try Neon DB via API first
    try {
      const res = await fetch(`/api/orders?id=${encodeURIComponent(orderId)}`);
      if (res.ok) {
        const data = await res.json();
        if (data.order && String(data.order.customer_phone).replace(/\D/g,'').slice(-10) === phone) {
          order = data.order;
          order._source = 'neon';
        }
      }
    } catch(e) {}

    // Fallback: try Firebase
    if (!order && db) {
      const snap = await get(ref(db, `orders/${orderId}`));
      if (snap.exists()) {
        const d = snap.val();
        if (String(d.customer_phone || d.phone || '').replace(/\D/g,'').slice(-10) === phone) {
          order = d;
          order._source = 'firebase';
        }
      }
    }

    if (!order) {
      contentEl.innerHTML = `<div class="no-order">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <p style="font-weight:700;font-size:14px;margin-bottom:6px">Order not found</p>
        <p style="font-size:13px">Check your Order ID and phone number, or contact us on WhatsApp.</p>
      </div>`;
      resultEl.classList.add('show');
      return;
    }

    const status = order.payment_status || order.status || 'pending';
    const s = STATUS_MAP[status] || STATUS_MAP.pending;
    const items = Array.isArray(order.items) ? order.items : (order.items ? JSON.parse(order.items) : []);
    const addr  = typeof order.address === 'object' ? order.address : (order.address ? JSON.parse(order.address) : {});

    contentEl.innerHTML = `<div class="order-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div class="order-id">${s.icon} Order #${order.id || orderId}</div>
          <div class="order-meta">Placed on ${order.created_at ? new Date(order.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : 'recently'}</div>
        </div>
        <span class="order-status ${s.cls}">${s.label}</span>
      </div>
      ${order.tracking_id ? `<div style="background:#f0f8ff;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px">
        üìç Tracking ID: <strong>${order.tracking_id}</strong>
        ${order.courier ? ` (${order.courier})` : ''}
      </div>` : ''}
      <div class="order-items">
        ${items.map(i => `<div class="order-item"><span>${i.title || i.name}${i.size ? ` ‚Äî ${i.size}` : ''} √ó ${i.qty||1}</span><span>${fmt((i.price||0)*(i.qty||1))}</span></div>`).join('')}
        <div class="order-total"><span>Total</span><span>${fmt(order.amount || 0)}</span></div>
      </div>
      ${addr.address ? `<div style="margin-top:12px;font-size:12px;color:#666;border-top:1px solid #f0f0f0;padding-top:10px">üìç ${addr.name || ''}, ${addr.address}, ${addr.city} ‚Äì ${addr.pincode}</div>` : ''}
    </div>`;
    resultEl.classList.add('show');
  } catch(e) {
    errEl.textContent = 'Something went wrong. Please try again or contact us on WhatsApp.';
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'Track Order';
    btn.disabled = false;
  }
}

document.getElementById('track-btn').addEventListener('click', trackOrder);
document.getElementById('track-phone').addEventListener('keydown', e => { if (e.key === 'Enter') trackOrder(); });
document.getElementById('track-order-id').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('track-phone').focus(); });
</script>
